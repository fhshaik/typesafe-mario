[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typesafe-mario"
version = "0.1.0"
description = "A direct-control TypeSafe/Jev agent for Super Mario Bros."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "typesafe-sdk",
]

[project.optional-dependencies]
mario = [
  "gym-super-mario-bros>=9.1.0",
  "gymnasium",
  "nes-py>=9.0.1",
  "numpy>=2.1",
  "pygame-ce>=2.5.8",
]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

[project.scripts]
typesafe-mario = "typesafe_mario.cli:main"

[project.urls]
Repository = "https://github.com/fhshaik/typesafe-mario"

[tool.hatch.build.targets.wheel]
packages = ["src/typesafe_mario"]

[tool.ruff]
line-length = 100
target-version = "py313"
